<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋満 純平｜ポートフォリオ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ヘッダー：ページ最上部 -->
  <header class="header">
    <div class="header-inner">
      <img src="../image/jum.png" alt="アイコン" class="icon">
      <div>
        <h1>秋満 純平</h1>
        <p class="subtitle">ゲームプログラマー志望</p>
      </div>
    </div>

    <!-- ページ内リンク -->
    <nav class="nav">
      <a href="#about">自己紹介</a>
      <a href="#skills">スキル</a>
      <a href="#projects">個人制作物</a>
      <a href="#teamprojects">チーム制作物</a>
      <a href="#links">リンク</a>
    </nav>
  </header>

  <main class="container">

    <section id="about">
      <h2>自己紹介</h2>

      <div class="about-content">

        <div class="about-text">
          <p data-key="introduction"></p>
        </div>

        <div class="radar-wrapper">
          <div class="radar-title" data-key="radarTitle"></div>
          <canvas id="radarChart" width="250" height="250"></canvas>
        </div>

      </div>
    </section>

    <!-- スキル -->
    <section id="skills">
      <h2>スキル</h2>
      <div class="skill-chart">
        <div class="circle" style="--rate: 100%"><span class="circle-text">Unity</span></div>
        <div class="circle" style="--rate: 100%"><span class="circle-text">C#</span></div>
        <div class="circle" style="--rate: 75%"><span class="circle-text">Git</span></div>
        <div class="circle" style="--rate: 50%"><span class="circle-text">C++</span></div>
        <div class="circle" style="--rate: 25%"><span class="circle-text">Blender</span></div>
        <div class="circle" style="--rate: 10%"><span class="circle-text">DirectX</span></div>
      </div>
    </section>

    <!-- 個人制作物 -->
    <section id="projects">
      <h2>個人制作物</h2>
      <div id="project-list" class="project-list"></div>
    </section>

    <!-- チーム制作物 -->
    <section id="teamprojects">
      <h2>チーム制作物</h2>
      <div id="team-project-list" class="project-list"></div>
    </section>

    <!-- リンク -->
    <section id="links">
      <h2>リンク</h2>
      <ul class="link-list">
        <li>
          <a data-key="github" target="_blank" rel="noopener noreferrer">
            GitHub
          </a>
        </li>

        <li>
          <a data-key="mail">
            Gmail
          </a>
        </li>
      </ul>
    </section>

  </main>

  <!-- フッター -->
  <footer class="footer">
    <p>© 2026 秋満 純平</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
